# يبقي قاعدة بيانات Supabase المجانية شغّالة (تتوقف تلقائيًا بعد أسبوع بدون نشاط)
# ويحافظ على نشاط المستودع حتى لا يوقف GitHub المهام المجدولة
name: keep-alive
on:
  schedule:
    - cron: '17 6 */3 * *'   # كل 3 أيام
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' config.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+' config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js بدون مفاتيح"; exit 0; fi
          if [[ "$KEY" == sb_* ]]; then AUTH=(); else AUTH=(-H "Authorization: Bearer $KEY"); fi
          curl -sf "$URL/rest/v1/settings?select=key&limit=1" -H "apikey: $KEY" "${AUTH[@]}" && echo " ok"
      - name: Keep repository active
        run: |
          date -u > .github/last-ping.txt
          git config user.name "keep-alive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/last-ping.txt
          git commit -m "keep-alive" || true
          git push || true
