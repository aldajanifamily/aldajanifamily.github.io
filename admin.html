<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم · شجرة العائلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<style>
:root{--cream:#F3ECDF;--paper:#FBF8F2;--line:#E6DCCB;--ink:#18231B;--ink2:#3A463C;--muted:#7F8577;--olive:#2F3D22;--olive2:#5E7238;--gold:#C9A048;--gold2:#E8CB86;--terra:#B4532F;--mg:#1F9D5E;--red:#C0392B}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:400 15px 'IBM Plex Sans Arabic',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#E9DDC4,var(--cream) 60%)}
.lcard{width:min(420px,100%);background:var(--paper);border-radius:28px;padding:34px;box-shadow:0 30px 70px -30px rgba(40,30,10,.45)}
.lcard .brand{font-family:'Aref Ruqaa';font-size:34px;color:var(--olive)}
.lcard h1{font-family:Alexandria;font-size:22px;margin:6px 0 20px}
.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:12px}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--terra)}
.f small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;background:#fff;border-color:var(--line);transition:.15s}
.btn:hover{border-color:var(--olive2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2a3a2d}
.btn.gold{background:linear-gradient(135deg,#EFD594,#C29440);border:none;color:#221a07}
.btn.danger{color:var(--red);border-color:#F0C9C3;background:#FFF6F4}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.mode{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:#FFF1D6;color:#8A6111;border:1px solid #F0D9A6}
.mode.live{background:#E3F4EA;color:#1F7A4D;border-color:#BFE5CF}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--olive);color:#E9E3D3;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{font-family:'Aref Ruqaa';font-size:28px;color:var(--gold2);padding:0 10px}
.side .ssub{font-size:12px;color:#A9B39A;padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:#D9D6C6;font-weight:500;margin-bottom:2px;cursor:pointer}
.nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--gold2);color:#1d1606;font-weight:700}
.nav a .cnt{margin-right:auto;background:var(--terra);color:#fff;font-size:11px;font-family:Alexandria;padding:2px 8px;border-radius:999px}
.side .foot{margin-top:24px;padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side .foot a{color:var(--gold2)}
.main{padding:24px 30px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-family:Alexandria;font-size:26px;margin:0}
.top .me{display:flex;align-items:center;gap:10px;font-size:13px}
.av{width:36px;height:36px;border-radius:50%;background:var(--olive2);color:#fff;display:grid;place-items:center;font-weight:700}
.burger{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;right:0;width:260px;z-index:50;transform:translateX(110%);transition:.3s}.side.open{transform:none}.burger{display:inline-flex}.main{padding:18px 14px 60px}}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}
.card h3{font-family:Alexandria;font-size:17px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:Alexandria;font-size:32px;margin-top:4px}
.kpi.t b{color:var(--terra)}.kpi.g b{color:var(--mg)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.cols2{grid-template-columns:1fr}}
.bars .r{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bars .tr{height:9px;background:#EDE4D3;border-radius:9px;overflow:hidden}.bars .tr i{display:block;height:100%;background:var(--olive2);border-radius:9px}
.bars b{font-family:Alexandria;text-align:left}
.meter{margin-bottom:12px}.meter div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.meter .tr{height:8px;background:#EDE4D3;border-radius:8px;overflow:hidden}.meter .tr i{display:block;height:100%;background:var(--gold)}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EFE7D8;font-size:14px}
.list .it:last-child{border:none}
.list small{color:var(--muted)}
/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input,.tools select{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}
.tools input[type=search]{min-width:240px;flex:1}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid #EFE7D8;font-size:14px;vertical-align:middle}
th{background:#F1E9DA;font-weight:600;font-size:13px;color:var(--ink2)}
tr:hover td{background:#FFFDF8}
td small{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:#EEE6D6;color:var(--ink2);white-space:nowrap}
.chip.m{background:#DFF3E7;color:#1F7A4D}.chip.d{background:#EEE}.chip.new{background:#FDE7DF;color:var(--terra)}.chip.ok{background:#DFF3E7;color:#1F7A4D}.chip.rev{background:#FFF1D6;color:#8A6111}.chip.rej{background:#EEE;color:#777}
.pager{display:flex;gap:6px;justify-content:center;margin-top:14px}
.tablewrap{overflow-x:auto}
/* drawer */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(15,20,16,.45)}
.drawer .pane{position:absolute;top:0;bottom:0;left:0;width:min(640px,100%);background:var(--paper);overflow-y:auto;box-shadow:20px 0 60px -20px rgba(0,0,0,.4);display:flex;flex-direction:column}
.dh{position:sticky;top:0;background:var(--paper);z-index:2;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh h3{font-family:Alexandria;margin:0;font-size:20px}
.db{padding:18px 22px;flex:1}
.df{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:16px;padding:14px 16px 4px;margin:0 0 14px}
legend{font-family:Alexandria;font-weight:700;font-size:14px;padding:0 6px;color:var(--olive)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.multi .row{display:flex;gap:6px;margin-bottom:6px}.multi .row input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.thumbs .t{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:#EEE6D6}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}
.uplbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #D2C3A6;border-radius:12px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:12px}
.uplbtn input{display:none}
/* submissions */
.subs{display:grid;gap:12px}
.sub{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.sub .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sub .hd b{font-family:Alexandria}
.sub .msg{white-space:pre-wrap;line-height:1.8;background:#fff;border:1px solid #EFE7D8;border-radius:12px;padding:10px 12px;margin:8px 0}
.sub .att{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sub .att a{display:block;width:96px;height:96px;border-radius:12px;overflow:hidden;background:#EEE6D6;font-size:12px;text-align:center;text-decoration:none;display:grid;place-items:center;padding:4px}
.sub .att img{width:100%;height:100%;object-fit:cover}
.sub .act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sub .act select{padding:6px 10px;border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mc{background:#0D3A2C;color:#EAF3EE;border-radius:18px;padding:10px;cursor:pointer;text-align:center}
.mc .ph{aspect-ratio:1;border-radius:999px 999px 12px 12px;background:#145040 center/cover;display:grid;place-items:center;font-family:'Aref Ruqaa';font-size:44px;color:var(--gold2);margin-bottom:8px}
.mc b{display:block;font-size:14px}.mc small{color:#9FC7B4;font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;transition:.3s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{background:#FFF8E8;border:1px solid #F0DDB0;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.8;color:#6E5410;margin-bottom:14px}
.empty{padding:30px;text-align:center;color:var(--muted)}
pre.code{direction:ltr;text-align:left;background:#1d241e;color:#E8E4D6;border-radius:14px;padding:14px;overflow-x:auto;font-size:12.5px}
@media(max-width:700px){#ptab th:nth-child(2),#ptab td:nth-child(2),#ptab th:nth-child(3),#ptab td:nth-child(3),#ptab th:nth-child(4),#ptab td:nth-child(4){display:none}#ptab td:last-child{white-space:normal!important}#ptab td:last-child .btn{margin:2px 0}.tools input[type=search]{min-width:0;width:100%}.top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <form class="lcard" id="lform">
    <div class="brand" id="lbrand">آل الدجني</div>
    <h1>لوحة تحكم شجرة العائلة</h1>
    <div id="lmode" style="margin-bottom:16px"></div>
    <label class="f">اسم المستخدم <small style="color:var(--muted)">(أو الإيميل)</small><input name="email" type="text" dir="ltr" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="مثال: ahmad"></label>
    <label class="f">كلمة المرور<input name="password" type="password" autocomplete="current-password"></label>
    <button class="btn pri wide" type="submit">دخول</button>
    <div style="margin-top:12px;font-size:13px;color:var(--muted);line-height:1.8" id="lhint"></div>
    <button class="btn wide hidden" type="button" id="lsignup" style="margin-top:8px">أول مرة؟ أنشئ كلمة مرور لحسابك</button>
  </form>
</div>

<!-- APP -->
<div class="shell hidden" id="app">
  <aside class="side" id="side">
    <div class="brand" id="sbrand">آل الدجني</div>
    <div class="ssub">لوحة التحكم <span id="smode"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><a href="index.html" target="_blank">↗ عرض الموقع</a><br><br><a href="#" id="logout">تسجيل الخروج</a></div>
  </aside>
  <main class="main">
    <div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn sm burger" id="burger">☰</button><h2 id="vtitle"></h2></div><div class="me" id="me"></div></div>
    <div id="view"></div>
  </main>
</div>

<div class="drawer" id="drawer"><div class="bg" data-close></div><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script>
(async function(){
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)};
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const PERMS={people:'الأفراد والشجرة',martyrs:'الشهداء',submissions:'طلبات الزوار',pages:'الصفحات',users:'المستخدمون والصلاحيات',settings:'الإعدادات والنسخ الاحتياطي'};
const ROLES={owner:'مدير عام (كل الصلاحيات)',editor:'محرر',reviewer:'مراجع طلبات',custom:'مخصّص'};
const STATUS={new:'جديد',review:'قيد المراجعة',done:'تمت الإضافة',rejected:'مرفوض'};
const TYPES={martyr:'صور ومعلومات عن شهيد',kids:'صور الأبناء',new:'إضافة مولود أو فرد جديد',fix:'تصحيح أو إضافة بيانات',other:'أخرى'};
const FIELDS={bd:'تاريخ الميلاد',dd:'تاريخ الوفاة',res:'الدولة',city:'المدينة',edu:'الدراسة',work:'العمل',sp:'الزوج/الزوجة',fa:'الأب (خارج العائلة)',mo:'الأم (خارج العائلة)',notes:'الملاحظات',bio:'السيرة',photo:'الصورة',all:'إخفاء كل البيانات ما عدا الاسم'};
const IC={dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14c3 0 5 2.2 5 5"/>',mart:'<path d="M12 3c4 4 6 8 0 18C6 11 8 7 12 3z"/>',inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',pages:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',users:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/><path d="M19 3l2 2-4 4"/>',log:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'};
const svgI=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const S=window.Store,LIVE=S.mode==='supabase';
let ME=null,P=[],BY=new Map(),SETTINGS={},SUBS=[];

/* ---------- login ---------- */
const UDOM='aldajanifamily.github.io';
const loginId=v=>{v=String(v||'').trim().toLowerCase();return v.includes('@')?v:v+'@'+UDOM};
const uname=e=>String(e||'').toLowerCase().endsWith('@'+UDOM)?String(e).split('@')[0]:String(e||'');
const genPass=()=>{const a='abcdefghjkmnpqrstuvwxyz',d='23456789';let p='';for(let i=0;i<5;i++)p+=a[Math.floor(Math.random()*a.length)];for(let i=0;i<4;i++)p+=d[Math.floor(Math.random()*d.length)];return p};
const settings0=await S.settings().catch(()=>({}));
if(settings0.familyName){$('#lbrand').textContent=settings0.familyName;$('#sbrand').textContent=settings0.familyName}
$('#lmode').innerHTML=LIVE?'<span class="mode live">● متصل بقاعدة البيانات</span>':'<span class="mode">وضع تجريبي — البيانات تُحفظ على هذا الجهاز فقط</span>';
$('#lhint').textContent=LIVE?'ادخل باسم المستخدم وكلمة المرور اللي وصلتك من إدارة الموقع.':'للتجربة: اكتب أي إيميل واضغط دخول (بدون كلمة مرور).';
if(!LIVE){$('#lform').email.value='admin@demo'}
async function enter(){ME=await S.me();if(!ME||ME.role==='none'||!ME.role){if(LIVE&&ME)toast('هذا الحساب غير مضاف كمدير. اطلب من المدير العام إضافته.');return false}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadAll();buildNav();go(location.hash.slice(1)||'dash');return true}
$('#lform').onsubmit=async e=>{e.preventDefault();try{await S.signIn(loginId(e.target.email.value),e.target.password.value);await enter()}catch(err){toast('تعذّر الدخول: '+err.message)}};
$('#lsignup').onclick=async()=>{const f=$('#lform');if(!f.email.value||f.password.value.length<6)return toast('اكتب إيميلك وكلمة مرور من 6 أحرف على الأقل');try{await S.signUp(f.email.value.trim().toLowerCase(),f.password.value);toast('تم إنشاء الحساب. إذا طُلب منك تأكيد الإيميل افتح بريدك ثم سجّل الدخول.');await enter()}catch(err){toast(err.message)}};
$('#logout').onclick=async e=>{e.preventDefault();await S.signOut();location.reload()};
if(LIVE&&await S.me())await enter();

/* ---------- data ---------- */
async function loadAll(){P=await S.people();BY=new Map(P.map(p=>[p.id,p]));SETTINGS=await S.settings();SUBS=await S.submissions().catch(()=>[]);index()}
function index(){P.forEach(p=>{const par=BY.get(p.p);if(!par||!par.sp||par.sp.length!==1)return;if(par.g==='f'&&!p.fa)p.fa=par.sp[0];else if(par.g==='m'&&!p.mo)p.mo=par.sp[0]});P.forEach(p=>{p._k=[]});P.forEach(p=>{const f=BY.get(p.p);if(f)f._k.push(p)});P.forEach(p=>{let d=0,c=p;while(c&&c.p>=0&&BY.get(c.p)){d++;c=BY.get(c.p)}p._gen=d;p._dead=!!(p.dd||p.m)})}
const title=p=>(p.m?(p.g==='f'?'الشهيدة ':'الشهيد '):'')+p.n;

/* ---- in-law martyrs (stored on the related family member: martyr_info.inlaw[key]) ---- */
const nA=t=>String(t||'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
function inlaws(){const out=[];P.forEach(p=>{const par=BY.get(p.p);const src=(p.sp||[]).map(v=>[v,'sp']).concat(par&&par.g==='f'&&p.fa?[[p.fa,'fa']]:[]).concat(par&&par.g==='m'&&p.mo?[[p.mo,'mo']]:[]);
  src.forEach(([v,k])=>{const m=String(v).match(/^الشهيد(ة)?\s+(.+)$/);if(!m)return;const nm=m[2].trim(),w=nA(nm).split(/\s+/);
    const isNode=P.some(q=>{const qf=BY.get(q.p);return q.m&&nA(q.n)===w[0]&&w[1]&&qf&&(nA(qf.n)===w[1]||nA(q.fa).startsWith(w[1]))});if(isNode)return;
    const key=w.slice(0,2).join(' '),ex=out.find(x=>x.key===key);
    if(ex){if(nm.length>ex.n.length)ex.n=nm;if(k==='sp'&&ex.k!=='sp'){ex.id=p.id;ex.k='sp'}return}
    out.push({key,id:p.id,n:nm,f:!!m[1],k})})});return out}
const ilRel=x=>{const s=BY.get(x.id),sf=BY.get(s.p);const of=`${s.n} ${s.g==='f'?'بنت':'بن'} ${sf?sf.n:''}`;return x.k==='sp'?(x.f?'زوجة ':'زوج ')+of:(x.f?'والدة ':'والد ')+of};
const ilData=x=>{const s=BY.get(x.id);return(s&&s.mi&&s.mi.inlaw&&s.mi.inlaw[x.key])||{}};
function editInlaw(x){const d=ilData(x);let photos=(d.photos||[]).slice();
  openDrawer(`<div class="dh"><h3>${x.f?'الشهيدة':'الشهيد'} ${esc(x.n)}</h3><button class="btn sm" data-x>✕</button></div><form class="db" id="ilf">
   <div class="note" style="margin-top:0">${esc(ilRel(x))} — من أصهار العائلة</div>
   <label class="f">الصور <small style="color:var(--muted)">(أول صورة هي الرئيسية)</small></label><div id="ilPh" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>
   <label class="btn sm" style="display:inline-block;margin-bottom:14px">+ رفع صور<input type="file" id="ilUp" accept="image/*" multiple hidden></label>
   <label class="f">تاريخ الاستشهاد <small style="color:var(--muted)">(مثل 16-10-2023)</small><input name="dd" dir="ltr" value="${esc(d.dd||'')}"></label>
   <label class="f">نبذة<textarea name="bio" rows="4">${esc(d.bio||'')}</textarea></label>
   <label class="f">ذكريات الأهل<textarea name="mem" rows="3">${esc(d.memories||'')}</textarea></label>
   <label class="f">رابط فيديو<input name="video" dir="ltr" value="${esc(d.video||'')}"></label></form>
   <div class="df"><button class="btn pri" id="ilSave">حفظ</button><button class="btn" data-x>إلغاء</button></div>`);
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeDrawer);
  const draw=()=>{$('#ilPh').innerHTML=photos.map((u,i)=>`<div style="position:relative;width:84px;height:84px;border-radius:12px;background:center/cover url('${u}')"><button type="button" class="btn sm danger" data-rm="${i}" style="position:absolute;top:4px;left:4px;padding:2px 8px">✕</button></div>`).join('')||'<small style="color:var(--muted)">لا توجد صور بعد</small>';
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);draw()})};draw();
  $('#ilUp').onchange=async e=>{toast('جارٍ رفع الصور…');for(const f of e.target.files){try{photos.push(await S.upload(f))}catch(err){toast(err.message)}}draw()};
  $('#ilSave').onclick=async()=>{const F=$('#ilf'),s=BY.get(x.id),o=JSON.parse(JSON.stringify(s));o.mi=o.mi||{};o.mi.inlaw=o.mi.inlaw||{};
    const v={photos,dd:F.dd.value.trim(),bio:F.bio.value.trim(),memories:F.mem.value.trim(),video:F.video.value.trim(),name:x.n};Object.keys(v).forEach(k=>{if(!v[k]||(Array.isArray(v[k])&&!v[k].length))delete v[k]});
    o.mi.inlaw[x.key]=v;try{await S.savePerson(o);await log('تعديل صهر شهيد',x.n);await loadAll();closeDrawer();toast('تم الحفظ');R.martyrs()}catch(err){toast('خطأ: '+err.message)}}}

   ${s.admin_note?`<div style="font-size:13px;color:var(--muted)">ملاحظة الإدارة: ${esc(s.admin_note)}</div>`:''}
   <div class="act"><select data-st>${Object.entries(STATUS).map(([k,l])=>`<option value="${k}" ${s.status===k?'selected':''}>${l}</option>`).join('')}</select>

   ${can('people')?'<button class="btn sm" data-person>فتح الشخص / إضافة البيانات</button>':''}${can('people')&&(s.files||[]).some(f=>f.url&&f.type&&f.type.startsWith('image'))?'<button class="btn sm" data-photos>إضافة الصور لشخص</button>':''}<button class="btn sm danger" data-del>حذف</button></div></div>`).join('')||'<div class="empty card">لا توجد طلبات هنا</div>';
  document.querySelectorAll('.sub').forEach(el=>{const id=isNaN(+el.dataset.id)?el.dataset.id:+el.dataset.id,s=SUBS.find(x=>x.id==id);
    el.querySelector('[data-st]').onchange=async e=>{await S.updateSubmission(s.id,{status:e.target.value});await log('تغيير حالة طلب',(TYPES[s.type]||'')+' — '+s.sender_name);toast('تم التحديث');R.subs()};
    el.querySelector('[data-note]').onchange=async e=>{await S.updateSubmission(s.id,{admin_note:e.target.value});toast('حُفظت الملاحظة')};
    el.querySelector('[data-del]').onclick=async()=>{if(!confirmBox('حذف الطلب؟'))return;await S.deleteSubmission(s.id);R.subs()};
    const findP=()=>{const id=parseInt(s.person_ref);if(BY.has(id))return BY.get(id);const nm=(s.person_ref||'').replace(/^الشهيدة? /,'').split(' — ')[0].trim();const lin=(s.person_ref||'').split(' — ')[1]||'';return P.find(p=>lin&&lineage(p,4)===lin.trim())||P.find(p=>p.n===nm)};
    const pb=el.querySelector('[data-person]');pb&&(pb.onclick=async()=>{if(s.status==='new')await S.updateSubmission(s.id,{status:'review'});const p=findP();if(s.type==='new'){editPerson(null,p?p.id:undefined)}else if(p)editPerson(p,null,s.type==='martyr'?'m':null);else{toast('لم أجد الاسم تلقائيًا — ابحث عنه في قسم الأفراد');go('people')}});
    const ph=el.querySelector('[data-photos]');ph&&(ph.onclick=async()=>{const p=findP();if(!p)return toast('حدد الشخص أولًا من «فتح الشخص»');const imgs=s.files.filter(f=>f.url&&f.type.startsWith('image')).map(f=>f.url);const o=JSON.parse(JSON.stringify(p));if(o.m){o.mi=o.mi||{};o.mi.photos=[...(o.mi.photos||[]),...imgs]}else if(!o.photo)o.photo=imgs[0];await S.savePerson(o);await S.updateSubmission(s.id,{status:'done'});await log('إضافة صور من طلب',title(p));await loadAll();toast('أُضيفت الصور إلى '+title(p));R.subs()});
  })};

function editUser(u){const isNew=!u;u=u||{email:'',name:'',role:'editor',perms:S.ROLE_PERMS.editor};
  openDrawer(`<div class="dh"><h3>${isNew?'مستخدم جديد':'تعديل المستخدم'}</h3><button class="btn sm" data-x>✕</button></div><form class="db" id="uf">

  <label class="f">إيميل للتواصل <small style="color:var(--muted)">(اختياري)</small><input name="contact" type="email" dir="ltr" value="${esc(u.contact||'')}"></label>
  <label class="f">الدور<select name="role">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}</select></label>

function showCreds(name,user,pass){

   <div class="df"><button class="btn pri" id="cCopy">نسخ</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">إرسال واتساب</a><button class="btn" data-x>إغلاق</button></div>`);
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeDrawer);
  $('#cCopy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast('تم النسخ')}catch(e){$('#credTxt').select();document.execCommand('copy');toast('تم النسخ')}}}

/* ---- activity ---- */
R.log=async()=>{const L=await S.activity().catch(()=>[]);$('#view').innerHTML=`<div class="tablewrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>على</th></tr></thead><tbody>${L.map(a=>`<tr><td>${new Date(a.at).toLocaleString('ar')}</td><td dir="ltr" style="text-align:right">${esc(uname(a.user_email))}</td><td>${esc(a.action)}</td><td>${esc(a.target||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا يوجد سجل بعد</td></tr>'}</tbody></table></div>`};

/* ---- settings ---- */
R.settings=()=>{const s=SETTINGS;
  $('#view').innerHTML=`<div class="cols2"><div class="card"><h3>نصوص الموقع</h3><form id="sf">
   <label class="f">اسم العائلة (العنوان الكبير)<input name="familyName" value="${esc(s.familyName||'')}"></label>
   <label class="f">السطر الصغير فوق العنوان<input name="kicker" value="${esc(s.kicker||'')}"></label>
   <label class="f">الآية / العبارة تحت العنوان<input name="verse" value="${esc(s.verse||'')}"></label>
   <label class="f">سلسلة الأجداد قبل الجد الأول (من الأقرب للأبعد، افصل بفاصلة)<input name="ancestors" value="${esc((s.ancestors||[]).join('، '))}"></label>
   <div class="two"><label class="f">واتساب الإدارة<input name="whatsapp" dir="ltr" value="${esc(s.whatsapp||'')}"></label><label class="f">إيميل الإدارة<input name="email" dir="ltr" value="${esc(s.email||'')}"></label></div>
   <button class="btn pri" type="submit">حفظ الإعدادات</button></form></div>
   <div class="card"><h3>النسخ الاحتياطي والبيانات</h3>
    <p style="font-size:14px;line-height:1.9;color:var(--ink2)">انسخ كل بيانات الموقع كملف JSON واحتفظ به. ويمكنك استعادته لاحقًا.</p>
    <div class="tools"><button class="btn" id="exp">⬇ تنزيل نسخة احتياطية</button><button class="btn" id="expc">نسخ البيانات</button><label class="btn">⬆ استعادة من ملف<input type="file" accept=".json" id="imp" hidden></label></div>
    ${LIVE?`<div class="note">قاعدة البيانات فيها ${P.length} فرد. لنقل بيانات الشجرة الأصلية (${(window.SEED_PEOPLE||[]).length} فرد) إلى قاعدة البيانات لأول مرة اضغط:</div><button class="btn gold" id="seed">نقل بيانات الشجرة إلى قاعدة البيانات</button>`:`<button class="btn danger" id="reset">إعادة البيانات التجريبية للأصل</button>`}
   </div></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const f=e.target;const o=Object.assign({},SETTINGS,{familyName:f.familyName.value.trim(),kicker:f.kicker.value.trim(),verse:f.verse.value.trim(),ancestors:f.ancestors.value.split(/[،,]/).map(x=>x.trim()).filter(Boolean),whatsapp:f.whatsapp.value.trim(),email:f.email.value.trim()});await S.saveSettings(o);SETTINGS=o;await log('تعديل الإعدادات','');toast('تم الحفظ')};
  const dump=async()=>JSON.stringify(await S.exportAll(),null,1);
  $('#exp').onclick=async()=>{try{const b=new Blob([await dump()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='family-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){toast('التنزيل غير متاح هنا — استخدم «نسخ البيانات»')}};
  $('#expc').onclick=async()=>{try{await navigator.clipboard.writeText(await dump());toast('تم نسخ البيانات')}catch(e){toast('تعذّر النسخ')}};
  $('#imp').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!o.people)throw new Error('ملف غير صالح');await S.importAll(o);await log('استعادة نسخة احتياطية',o.people.length+' فرد');await loadAll();toast('تمت الاستعادة');R.settings()}catch(err){toast('خطأ: '+err.message)}};
  $('#seed')&&($('#seed').onclick=async()=>{if(!confirmBox('نقل بيانات الشجرة الأصلية؟'))return;try{await S.importAll({people:window.SEED_PEOPLE,pages:window.SEED_PAGES,settings:window.SEED_SETTINGS});await log('نقل البيانات الأولية','');await loadAll();toast('تم نقل البيانات');R.settings()}catch(err){toast('خطأ: '+err.message)}});
  $('#reset')&&($('#reset').onclick=async()=>{if(!confirmBox('إعادة البيانات التجريبية؟ ستضيع تعديلاتك على هذا الجهاز'))return;await S.reset();await S.signIn('admin@demo');await loadAll();toast('تمت الإعادة');R.settings()})};

addEventListener('hashchange',()=>{if(ME){const v=location.hash.slice(1);if(R[v]&&v!==CUR)go(v)}});
})();
</script>
</body>
</html>
